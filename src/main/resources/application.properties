# ========================
# Learn Hub - Database
# ========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learn_hub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:@#$REdo12!!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}

# ========================
# JWT Configuration
# ========================
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckxlYXJuSHViTE1TMjAyNlNFVUFkdmFuY2VkSmF2YUxhYg==}
jwt.expiration=86400000

# ========================
# Server
# ========================
server.port=${PORT:8080}
spring.application.name=LearnHub

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# Logging
# ========================
logging.level.com.redoy=DEBUG
logging.level.org.springframework.security=INFO