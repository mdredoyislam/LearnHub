<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Learn Hub</title>
  <meta name="description" content="Sign in to your Learn Hub account to access courses, lessons, and certificates."/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="hero-bg-orb orb1" style="position:fixed;"></div>
<div class="hero-bg-orb orb2" style="position:fixed;"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo">Learn<span>Hub</span></div>
      <p class="auth-subtitle" style="margin-top:0.5rem;margin-bottom:0;">Welcome back! Sign in to continue learning.</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" style="margin-top:1.5rem;">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Your password" required/>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
        Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div style="text-align:center;font-size:0.9rem;color:var(--text-muted);">
      Don't have an account?
      <a href="/register.html" style="color:var(--indigo-light);font-weight:600;margin-left:0.25rem;">Create one</a>
    </div>

    <div style="margin-top:1.5rem;padding:1rem;background:rgba(99,102,241,0.06);border-radius:10px;border:1px solid rgba(99,102,241,0.15);">
      <p class="text-sm" style="margin-bottom:0.75rem;font-weight:700;color:var(--text-primary);">Demo Credentials</p>
      <p class="text-sm text-muted" style="margin-bottom:0.35rem;">Admin: <code>admin@test.com</code></p>
      <p class="text-sm text-muted" style="margin-bottom:0.35rem;">Teacher: <code>teacher@test.com</code></p>
      <p class="text-sm text-muted" style="margin-bottom:0.5rem;">Student: <code>student@test.com</code></p>
      <p class="text-sm" style="color:var(--indigo-light);font-weight:600;">Password: <code>Password123!</code></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  // If already logged in, redirect immediately
  if (isLoggedIn()) {
    console.log('[LearnHub] Already logged in as:', localStorage.getItem('lh_role'), '— redirecting...');
    redirectToDashboard();
  }
</script>
</body>
</html>
